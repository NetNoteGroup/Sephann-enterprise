<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Sephann Enterprises</title><meta name="description" content="Contact Sephann Enterprises by email, phone or WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/pages.css">
</head><body data-root=""><div id="site-header"></div>
<section class="page-hero" style="background-image:url(images/contact/contact-hero-main.jpg)"><div class="overlay"></div><div class="wrap"><h1>Contact Us</h1><p>We would love to hear from you</p></div></section>
<section class="section"><div class="wrap split top"><div class="reveal"><h2>Get in touch</h2>
<ul class="contact-list"><li><span>Email</span><a data-mail-text href="#"></a> <button type="button" class="copy-btn" data-copy>Copy</button></li><li><span>Phone &amp; WhatsApp</span><a data-tel-text href="#"></a></li><li><span>Location</span><b data-loc></b><p class="addr" data-addr></p></li></ul>
<div class="socials" data-render="socials"></div></div>
<form class="card pad reveal" data-form><h3>Send us a message</h3><label>Your name<input name="name" required></label><label>Phone or email<input name="contact" required></label>
<label>What do you need?<select name="service"><option>General enquiry</option></select></label><label>Message<textarea name="msg" rows="4" required></textarea></label>
<button class="btn" type="submit" data-via="mail">Send by email</button> <button class="btn btn-wa" type="submit" data-via="wa">Send on WhatsApp</button><p class="hint">Email button not opening? Copy our email address and send from your own email app.</p></form></div></section>
<section class="section alt"><div class="wrap"><h2 class="center">Find us</h2><p class="center sub" data-loc-line></p><div data-render="map"></div></div></section>
<div id="site-footer"></div>
<script src="data/site.js"></script><script src="js/main.js"></script></body></html>
